logging:
  level:
    org:
      springframework:
        cloud:
          kubernetes: debug

management:
  endpoint:
    restart:
      enabled: true
    refresh:
      enabled: true
    shutdown:
      enabled: true
  endpoints.web.exposure.include: health,info,refresh,shutdown,env,restart

spring:
  cloud:
    kubernetes:
      config:
        enable-api: true
        sources:
          - namespace: default
            name: sample-configmap
